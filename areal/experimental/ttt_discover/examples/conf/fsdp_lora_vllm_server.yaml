experiment_name: tttd-lora-vllm
trial_name: trial0
seed: 1
cluster:
  n_nodes: 1
  n_gpus_per_node: 4
  fileroot: ./outputs
  name_resolve:
    type: nfs
    nfs_record_root: /tmp/areal/name_resolve
allocation_mode: vllm[rollout]:d4p1t1+fsdp[actor]:d4p1t1
rollout:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  scheduling_spec:
  - task_type: worker
    port_count: 2
    gpu: 1
    mem: 32
    cmd: python3 -m areal.infra.rpc.rpc_server
  backend: vllm:d4p1t1
vllm:
  model: Qwen/Qwen2.5-1.5B-Instruct
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: bfloat16
  max_model_len: 32768
  gpu_memory_utilization: 0.9
  enforce_eager: true
  enable_lora: true
  max_lora_rank: 32
  lora_modules:
  - '{"name": "tttd_lora_adapter", "path": "./lora_init", "base_model_name": "Qwen/Qwen2.5-1.5B-Instruct"}'
actor:
  backend: fsdp:d4p1t1
