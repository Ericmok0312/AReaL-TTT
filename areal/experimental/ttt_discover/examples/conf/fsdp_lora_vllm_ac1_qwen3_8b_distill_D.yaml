experiment_name: tttd-distill-D-no-privileged-random
trial_name: trial0
is_tttd_config: true
seed: 1
enable_offload: false
max_steps: 5
total_train_epochs: 5
enable_thinking: true
reset_puct_stats_on_resume: false
student_sampler_inherit_teacher_pool: true
use_privileged_teacher_logp: false
teacher_sampler_strategy: puct

# Native AReaL KDRL teacher config
teacher:
  backend: fsdp:d4p1t1
  rl_loss_weight: 0.0
  distill_loss_weight: 1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ./outputs_ac1_async_v2/checkpoints/eric/tttd-async-qwen3-8b-ac1/trial0/default/epoch49epochstep49globalstep49
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 32768
    n_mbs: 1
    granularity: 1
  optimizer: null
  scheduling_spec: ${actor.scheduling_spec}
  use_lora: false
  peft_type: ${actor.peft_type}
  lora_rank: ${actor.lora_rank}
  lora_alpha: ${actor.lora_alpha}
  target_modules:
  - all-linear

# Teacher PUCTSampler checkpoint (used for sampling only, no updates during distillation)
teacher_sampler_checkpoint: ./outputs_ac1_async_v2/tttd-async-qwen3-8b-ac1/trial0/sampler

run_eval_step: true
total_rollouts_per_step: 512

actor:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3-8B
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 32768
    n_mbs: 1
    granularity: 1
  scheduling_spec:
  - task_type: worker
    port_count: 2
    gpu: 1
    mem: 32
    cmd: python3 -m areal.infra.rpc.rpc_server
    env_vars: {}
  backend: fsdp:d4p1t1
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  optimizer:
    type: adam
    lr: 1e-5
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.95
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    level: token
    action: mask
    metric: ratio
    upper: 5.0
  # Disable reward/adv norm because dummy reward is all zeros in pure KD mode
  reward_norm: null
  adv_norm: null
  max_new_tokens: ${gconfig.max_new_tokens}
  use_lora: true
  peft_type: lora
  lora_rank: 32
  lora_alpha: 16
  target_modules:
  - all-linear
  weight_update_mode: xccl
  adv_estimator: mean_baseline
  adv_estimator_beta: 1.0
  adv_estimator_target_kl: 0.693
  adv_estimator_beta_max: 1000000.0
  adv_estimator_beta_iters: 60

tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ./outputs_ac1_distill_comparisons
  name_resolve:
    type: nfs
    nfs_record_root: /tmp/areal/name_resolve

allocation_mode: vllm[rollout]:d4p1t1+fsdp[actor]:d4p1t1

scheduler:
  type: null

rollout:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 512
  queue_size: null
  consumer_batch_size: ${sampler.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: false
  pause_grace_period: 1.0
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  use_lora: ${actor.use_lora}
  backend: vllm:d4p1t1

gconfig:
  n_samples: 32
  min_new_tokens: 0
  max_new_tokens: 32768
  max_tokens: 32768
  greedy: false
  temperature: 0.8
  top_p: 0.95
  lora_name: tttd_lora_adapter

max_prompt_thinking_tokens: 26000

ref:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: false
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 32768
    n_mbs: 1
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}
  backend: fsdp:d4p1t1

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 32768
  gpu_memory_utilization: 0.85
  enforce_eager: false
  enable_lora: ${actor.use_lora}
  max_lora_rank: 32
  lora_modules: '{"name": "${gconfig.lora_name}-v0", "path": "./lora_init_ac1_distill",
    "base_model_name": "${actor.path}"}'

sampler:
  type: puct
  batch_size: 16
  c_puct: 1.0
  gamma: 0.95
  max_children: 100
  max_states: 10000
  top_k: 1000
  temperature: 1.0
  save_freq: 100
  checkpoint_dir: ${cluster.fileroot}/${experiment_name}/${trial_name}/sampler
  initial_exp_type: random
  env_type: ac1
  budget_s: 1100
  eval_timeout: 1100
  num_cpus: 2
  gpu_type: H100
  n: 100
  sampling_strategy: parent_pool
  max_memory_mb: 16384

train_dataset:
  batch_size: ${sampler.batch_size}
  max_length: 32768

valid_dataset:
  batch_size: 8
  max_length: 32768

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 1
  freq_secs: null

recover:
  mode: 'on'
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 1
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
    project: tttd-distill-qwen3-8b-ac1
    entity: null

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false

teacher_lora_path: ${teacher.path}
student_lora_path: ${cluster.fileroot}/${experiment_name}/${trial_name}/eval_checkpoints/student

# Evaluation-specific batch/group sizes (only used by eval_tttd_multi_v2.py)
eval_batch_size: 8
eval_group_size: 64
