# TTT-Discover FSDP + LoRA + vLLM Configuration for Qwen3-32B on 8x H20
# Optimized for code generation tasks with thinking mode enabled

experiment_name: tttd-qwen3-32b-cp
trial_name: trial0

# Required for TTT-Discover entropic advantages
is_tttd_config: true

seed: 1
enable_offload: false

# TTT-Discover uses fixed number of steps (not epochs)
max_steps: 50
total_train_epochs: 10  # Ignored for TTT-Discover, use max_steps instead

# ============================================================================
# Qwen3-32B Configuration
# ============================================================================
path: Qwen/Qwen3-32B
enable_thinking: true  # Enable Qwen3 thinking mode for better reasoning

init_from_scratch: false
disable_dropout: true
gradient_checkpointing: true
dtype: bfloat16

mb_spec:
  max_tokens_per_mb: 8192  # Reduced for 32B model memory constraints

optimizer:
  type: adam
  lr: 1e-5  # Lower LR for larger model
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  lr_scheduler_type: constant
  gradient_clipping: 1.0
  warmup_steps_proportion: 0.001

# PPO parameters
eps_clip: 0.4
temperature: ${gconfig.temperature}
reward_scaling: 10.0
reward_bias: -0.5
kl_ctl: 0.01
ppo_n_minibatches: 1
recompute_logprob: true
use_decoupled_loss: true
rejection_sampling:
  level: token
  action: mask
  metric: ratio
  upper: 5.0

# Reward normalization
reward_norm:
  mean_level: group
  std_level: group
  group_size: ${gconfig.n_samples}

# Advantage normalization
adv_norm:
  mean_level: batch
  std_level: batch

max_new_tokens: ${gconfig.max_new_tokens}

# LoRA configuration - increased rank for 32B model
use_lora: true
peft_type: lora
lora_rank: 64
lora_alpha: 32
target_modules: [all-linear]
weight_update_mode: xccl

# TTT-Discover specific: Entropic Advantage
adv_estimator: entropic
adv_estimator_beta: 1.0
adv_estimator_target_kl: 0.693
adv_estimator_beta_max: 1000000.0
adv_estimator_beta_iters: 60

scheduling_spec:
  - task_type: worker
    port_count: 2
    gpu: 1
    mem: 64  # Increased memory for 32B model
    cmd: python3 -m areal.infra.rpc.rpc_server
    env_vars: {}

# Actor reference for launcher validation
actor:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${path}
  dtype: ${dtype}
  scheduling_spec: ${scheduling_spec}

# ============================================================================
# Other Configurations
# ============================================================================
tokenizer_path: ${path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ./outputs
  name_resolve:
    type: nfs
    nfs_record_root: /tmp/areal/name_resolve

# FSDP + vLLM for LoRA on 8x H20
# Allocation: 6 GPUs for vLLM inference (32B needs more), 2 GPUs for FSDP training
# Adjust based on your actual memory constraints
allocation_mode: vllm[rollout]:d6p1t1+fsdp[actor]:d2p1t1
backend: fsdp:d2p1t1

scheduler:
  type: null

# ============================================================================
# Rollout Configuration (vLLM)
# ============================================================================
rollout:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 128  # Reduced for 32B model
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 4
  enable_rollout_tracing: false
  pause_grace_period: 1.0
  scheduling_spec: ${scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  use_lora: ${use_lora}

# ============================================================================
# Generation Configuration
# ============================================================================
gconfig:
  # Group rollout: 64 samples per parent state
  n_samples: 64
  min_new_tokens: 0
  max_new_tokens: 16384  # Increased for code generation
  greedy: false
  temperature: 1.0
  top_p: 0.95
  # LoRA configuration
  lora_name: tttd_lora_adapter

# ============================================================================
# Reference Model Configuration
# ============================================================================
ref:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${dtype}
  mb_spec:
    max_tokens_per_mb: 8192
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${scheduling_spec}

# ============================================================================
# vLLM Configuration for Qwen3-32B
# ============================================================================
# IMPORTANT: For LoRA training, you must first run the preparation script
# to create the initial LoRA adapter before starting training:
#   python prepare_lora_init.py --config-path conf/fsdp_lora_vllm_qwen3_32b.yaml
# ============================================================================
vllm:
  model: ${path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${dtype}
  max_model_len: 32768
  gpu_memory_utilization: 0.92  # Increased for 32B model
  enforce_eager: true
  # LoRA support
  enable_lora: ${use_lora}
  max_lora_rank: 64  # Must be >= lora_rank
  # Initial LoRA module - MUST exist before training starts
  lora_modules: '{"name": "${gconfig.lora_name}", "path": "./lora_init_qwen3_32b", "base_model_name": "${path}"}'

# ============================================================================
# PUCT Sampler Configuration
# ============================================================================
sampler:
  type: puct
  batch_size: 4  # Reduced for 32B model memory constraints

  # PUCT parameters
  c_puct: 1.5
  gamma: 0.95
  max_children: 100

  # State management
  max_states: 10000
  top_k: 1000

  # Exploration
  temperature: 1.0

  # Checkpointing
  save_freq: 100
  checkpoint_dir: ${cluster.fileroot}/${experiment_name}/${trial_name}/sampler

  # Initial state
  initial_exp_type: best_available

  # Environment type for initial state creation
  env_type: cp

  # Environment-specific parameters
  n_item: 26
  gpu_type: H100
  eval_timeout: 60
  n: 100
  budget_s: 1000

# ============================================================================
# Dataset Configuration
# ============================================================================
train_dataset:
  batch_size: 4  # Reduced for 32B model (parents per DP rank)

valid_dataset:
  batch_size: 4

# ============================================================================
# Utilities Configuration
# ============================================================================
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
    project: tttd-qwen3-32b-cp
    entity: null

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
