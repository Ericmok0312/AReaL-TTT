experiment_name: tttd-async-qwen3-8b-ale-bench
trial_name: trial0
is_tttd_config: true
use_scheme_1: false
seed: 1
enable_offload: false
max_steps: 30
total_train_epochs: 30
history_save_freq: 1
enable_thinking: true
reset_puct_stats_on_resume: false
actor:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3-8B
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 32768
    n_mbs: 1
    granularity: 1
  scheduling_spec:
  - task_type: worker
    port_count: 2
    gpu: 1
    mem: 32
    cmd: python3 -m areal.infra.rpc.rpc_server
    env_vars: {}
  backend: fsdp:d4p1t1
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  optimizer:
    type: adam
    lr: 4e-5
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.95
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  kl_ctl: 0.01
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    level: token
    action: mask
    metric: ratio
    upper: 5.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  max_new_tokens: ${gconfig.max_new_tokens}
  use_lora: true
  peft_type: lora
  lora_rank: 32
  lora_alpha: 16
  target_modules:
  - all-linear
  weight_update_mode: xccl
  adv_estimator: entropic_adaptive_beta
  adv_estimator_beta: 1.0
  adv_estimator_target_kl: 0.693
  adv_estimator_beta_max: 1000000.0
  adv_estimator_beta_iters: 60
tokenizer_path: ${actor.path}
cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ./outputs_ale_bench_async
  name_resolve:
    type: nfs
    nfs_record_root: /tmp/areal/name_resolve
allocation_mode: vllm[rollout]:d4p1t1+fsdp[actor]:d4p1t1
scheduler:
  type: null
rollout:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 8
  queue_size: null
  consumer_batch_size: ${sampler.batch_size}
  max_head_offpolicyness: 2
  enable_rollout_tracing: true
  pause_grace_period: 1.0
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  use_lora: ${actor.use_lora}
  backend: vllm:d4p1t1
  # ALE-Bench requires C++ code, so keep sampling temperature reasonably high
  # and allow long reasoning before the final code block.
gconfig:
  n_samples: 64
  min_new_tokens: 0
  max_new_tokens: 32768
  max_tokens: 32768
  greedy: false
  temperature: 1.0
  top_p: 0.95
  lora_name: tttd_lora_adapter
max_prompt_thinking_tokens: 26000
ref:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: false
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 32768
    n_mbs: 1
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}
  backend: fsdp:d4p1t1
vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  max_num_seqs: 128
  no_enable_prefix_caching: false
  dtype: ${actor.dtype}
  max_model_len: 32768
  gpu_memory_utilization: 0.8
  enforce_eager: false
  enable_lora: ${actor.use_lora}
  max_lora_rank: 32
  lora_modules: '{"name": "${gconfig.lora_name}-v0", "path": "./lora_init_ale_bench",
    "base_model_name": "${actor.path}"}'
sampler:
  type: puct
  batch_size: 8
  c_puct: 1.0
  gamma: 0.95
  max_children: 100
  max_states: 100000
  top_k: 1000
  temperature: 1.0
  save_freq: 5
  checkpoint_dir: ${cluster.fileroot}/${experiment_name}/${trial_name}/sampler
  initial_exp_type: random
  env_type: ale_bench
  # Set problem_id per run, e.g. ahc008, ahc011, ahc015, ahc016, ahc024,
  # ahc025, ahc026, ahc027, ahc039, ahc046.
  problem_id: ahc039
  ale_bench_lite_version: false
  eval_timeout: 600
  num_cpus: 2
  budget_s: 1100
  lazy_puct_sampling: true
  vllm_concurrency: null
  execution_concurrency: 64
train_dataset:
  batch_size: ${sampler.batch_size}
  max_length: 32768
valid_dataset:
  batch_size: 8
  max_length: 32768
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 1
  freq_secs: null
recover:
  mode: 'on'
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 1
  freq_secs: 3600
evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null
stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
    project: tttd-qwen3-8b-ale-bench
    entity: null
perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
